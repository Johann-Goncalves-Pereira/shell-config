# Version files already used by a language (.node-version, .tool-versions, …).
[settings]
idiomatic_version_file_enable_tools = ["node", "python", "ruby", "go", "bun"]
legacy_version_file = true
# Missing tools must not block cd / prompt; install explicitly with `mise install`.
auto_install = false

# Node tracks the 24 line so `mise upgrade` (run by `update`) picks up patch
# releases; an exact pin never moved. Project version files still win.
[tools]
go = "latest"
node = "24"
python = "3.13"
ruby = "3.2"
